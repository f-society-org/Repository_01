<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Core Pack &mdash; Pack Opening</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <div class="stage">
      <div class="bg bg-dark"></div>
      <div class="bg bg-light"></div>

      <div class="scene">
        <!-- Unopened pack -->
        <div class="pack">
          <div class="pack-strip">
            <div class="ridge"></div>
          </div>
          <div class="pack-body">
            <div class="pack-sheen"></div>
            <div class="pack-ridge pack-ridge--top"></div>
            <div class="pack-brand">
              <span class="mark"></span>
              <span class="mark-text">ARC</span>
            </div>
            <div class="pack-title">Core<br>Pack</div>
            <div class="pack-sub">4 Cards Included &nbsp;/&nbsp; 2024</div>
            <div class="pack-badge"><span class="badge-num">01</span><span>Series</span></div>
            <div class="pack-ridge pack-ridge--bottom"></div>
          </div>
        </div>

        <!-- Revealed card -->
        <div class="card">
          <div class="card-flash"></div>
          <div class="card-sheen"></div>
          <div class="card-brand">
            <span class="mark mark--dark"></span>
            <span class="mark-text mark-text--dark">ARC</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
